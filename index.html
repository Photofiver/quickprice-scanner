<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner - Konsole i pady</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; background: #f8f9fa; }
    button { background: #0066ff; color: white; border: none; padding: 22px 70px; font-size: 22px; border-radius: 14px; margin: 30px 0; }
    #reader { width: 100%; max-width: 500px; margin: 0 auto; }
    .tip { font-size: 14px; color: #666; margin-top: 10px; }
</style>
</head>
<body>
    <h1>Scanner - Konsole i pady</h1>
    <p>Zeskanuj kod z tyłu konsoli lub pada</p>
    <button id="start">SKANUJ KOD</button>
    <div id="reader" style="display:none;"></div>
    <div id="result"></div>
    <p class="tip">Przytrzymaj telefon blisko naklejki</p>

<script>
    document.getElementById('start').onclick = () => {
        document.getElementById('start').style.display = 'none';
        document.getElementById('reader').style.display = 'block';

        const scanner = new Html5Qrcode("reader");
        scanner.start(
            { facingMode: "environment" },
            { fps: 6, qrbox: 320 },
            (code) => {
                scanner.stop();
                document.getElementById('reader').style.display = 'none';

                // 1. Wyszukiwanie po zeskanowanym kodzie
                window.open(`https://uk.webuy.com/search?stext=${encodeURIComponent(code)}`, '_blank');
                window.open(`https://www.ebay.co.uk/sch/i.html?_nkw=${encodeURIComponent(code)}`, '_blank');
                window.open(`https://www.ebay.co.uk/sch/i.html?_nkw=${encodeURIComponent(code)}&LH_Sold=1&LH_Complete=1`, '_blank');

                // 2. Dodatkowe wyszukiwania po popularnych modelach Xbox (lepsze wyniki na sprzedanych)
                setTimeout(() => {
                    window.open(`https://www.ebay.co.uk/sch/i.html?_nkw=Xbox+One&LH_Sold=1&LH_Complete=1`, '_blank');
                    window.open(`https://www.ebay.co.uk/sch/i.html?_nkw=Xbox+Series+X&LH_Sold=1&LH_Complete=1`, '_blank');
                    window.open(`https://www.ebay.co.uk/sch/i.html?_nkw=Xbox+Series+S&LH_Sold=1&LH_Complete=1`, '_blank');
                }, 800);

                document.getElementById('result').innerHTML = 
                    `Zeskanowano: <b>${code}</b><br>Otwarto wyszukiwania + popularne modele Xbox`;
            },
            () => {}
        );
    };
</script>
</body>
</html>
