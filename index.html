<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner - Konsole i pady</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 20px; background: #f8f9fa; }
    button { background: #0066ff; color: white; border: none; padding: 22px 70px; font-size: 22px; border-radius: 14px; margin: 30px 0; }
    #reader { width: 100%; max-width: 500px; margin: 0 auto; }
    .tip { font-size: 14px; color: #666; margin-top: 10px; }
    .search-section { margin-top: 12px; border-top: 1px solid #ddd; padding-top: 10px; }
    .section-title { font-size: 0.9rem; font-weight: bold; color: #333; margin-bottom: 6px; text-align: left; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { 
        display: inline-block; 
        padding: 10px 14px; 
        color: white; 
        text-decoration: none; 
        font-weight: bold; 
        border-radius: 8px; 
        font-size: 0.85rem; 
        flex: 1; 
        min-width: 70px; 
        text-align: center;
    }
    .btn-cex { background: #e74c3c; }
    .btn-ebay { background: #0064d2; }
    .btn-fb { background: #1877F2; }
</style>
</head>
<body>
    <h1>Scanner - Konsole i pady</h1>
    <p>Zeskanuj kod z tyłu konsoli lub pada</p>
    <button id="start">SKANUJ KOD</button>
    <div id="reader" style="display:none;"></div>
    <div id="result"></div>
    <p class="tip">Przytrzymaj telefon blisko naklejki</p>

<script>
    document.getElementById('start').onclick = () => {
        document.getElementById('start').style.display = 'none';
        document.getElementById('reader').style.display = 'block';

        const scanner = new Html5Qrcode("reader");
        scanner.start(
            { facingMode: "environment" },
            { fps: 6, qrbox: 320 },
            (code) => {
                scanner.stop();
                document.getElementById('reader').style.display = 'none';

                let html = `<strong>Zeskanowano:</strong> ${code}<br><br>`;

                // Surowy kod
                const encoded = encodeURIComponent(code);
                html += `<div class="search-section"><div class="section-title">Wyszukiwanie po kodzie</div>`;
                html += `<div class="btn-group">`;
                html += `<a href="https://uk.webuy.com/search?stext=${encoded}" target="_blank" class="btn btn-cex">CeX</a>`;
                html += `<a href="https://www.ebay.co.uk/sch/i.html?_nkw=${encoded}" target="_blank" class="btn btn-ebay">eBay</a>`;
                html += `<a href="https://www.ebay.co.uk/sch/i.html?_nkw=${encoded}&LH_Sold=1&LH_Complete=1" target="_blank" class="btn btn-ebay">eBay Sold</a>`;
                html += `</div></div>`;

                // Popularne modele
                const models = ["Xbox Series X", "Xbox Series S", "Xbox One", "PS5", "PS4", "Nintendo Switch"];
                html += `<div class="search-section"><div class="section-title">Popularne modele</div><div class="btn-group">`;
                
                models.forEach(model => {
                    const m = encodeURIComponent(model);
                    html += `<a href="https://uk.webuy.com/search?stext=${m}" target="_blank" class="btn btn-cex">${model} (CeX)</a>`;
                    html += `<a href="https://www.ebay.co.uk/sch/i.html?_nkw=${m}&LH_Sold=1&LH_Complete=1" target="_blank" class="btn btn-ebay">${model} (Sold)</a>`;
                    html += `<a href="https://www.facebook.com/marketplace/search/?query=${m}" target="_blank" class="btn btn-fb">${model} (FB)</a>`;
                });

                html += `</div></div>`;

                document.getElementById('result').innerHTML = html;
            },
            () => {}
        );
    };
</script>
</body>
</html>
