name: BloFin 15m phone alert

on:
  workflow_dispatch:
    inputs:
      continuation:
        description: "Internal continuation run"
        required: false
        default: "false"
  push:
    branches:
      - main
    paths:
      - ".github/blofin-alert-trigger"

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run continuous exact-close scanner
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUATION: ${{ inputs.continuation || 'false' }}
        run: |
          set -u

          post_scan () {
            if python blofin_alert_15m.py > scan.md; then
              {
                echo "@Photofiver"
                echo
                cat scan.md
              } > notification.md

              gh issue comment 1 --repo "${{ github.repository }}" --body-file notification.md || true
            else
              {
                echo "@Photofiver"
                echo
                echo "## BŁĄD SKANU 15m"
                echo
                echo "Skan nie wykonał się poprawnie. Kolejna próba nastąpi przy następnym zamknięciu świecy."
              } > notification.md

              gh issue comment 1 --repo "${{ github.repository }}" --body-file notification.md || true
            fi
          }

          if [ "$CONTINUATION" != "true" ]; then
            post_scan
          fi

          for i in $(seq 1 20); do
            NOW=$(date +%s)
            NEXT=$(( ((NOW / 900) + 1) * 900 + 3 ))
            WAIT=$(( NEXT - NOW ))
            echo "Waiting $WAIT seconds for the next 15m candle close"
            sleep "$WAIT"
            post_scan
          done

          gh workflow run blofin-alert-15m.yml             --repo "${{ github.repository }}"             -f continuation=true || true
