name: BloFin 15m phone alert

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/blofin-alert-trigger"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait until exact 15m candle close
        run: |
          NOW=$(date +%s)
          NEXT=$(( ((NOW / 900) + 1) * 900 + 3 ))
          WAIT=$(( NEXT - NOW ))
          echo "Waiting $WAIT seconds for next 15m close"
          sleep "$WAIT"

      - name: Run scan immediately after close
        run: python blofin_alert_15m.py > scan.md

      - name: Build notification
        run: |
          {
            echo "@Photofiver"
            echo
            cat scan.md
          } > notification.md

      - name: Post alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --repo "${{ github.repository }}" --body-file notification.md
