name: Restart live scanner

on:
  push:
    branches:
      - main
    paths:
      - ".github/restart-live-scanner"

permissions:
  actions: write
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel old live scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 37210630731 --repo "${{ github.repository }}"
