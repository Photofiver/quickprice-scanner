name: BloFin schedule heartbeat

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/blofin-schedule-heartbeat.yml"
  schedule:
    - cron: "1,16,31,46 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduler
        run: |
          echo "Heartbeat OK"
          date -u
